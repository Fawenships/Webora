<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Webora</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F7F8FA;
  --surf:#fff;
  --fg:#14181F;
  --mut:#5B6472;
  --line:#E3E6EB;
  --ac:#2A3BE8;
  --acf:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1218;
    --surf:#171B23;
    --fg:#ECEEF2;
    --mut:#98A1B0;
    --line:#262C38;
    --ac:#7B88FF;
    --acf:#0F1218
  }
}

:root[data-theme="dark"]{
  --bg:#0F1218;
  --surf:#171B23;
  --fg:#ECEEF2;
  --mut:#98A1B0;
  --line:#262C38;
  --ac:#7B88FF;
  --acf:#0F1218
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

*,*:before,*:after{box-sizing:inherit}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:400 16px/1.6 'Instrument Sans',system-ui,sans-serif
}

h1,h2,h3{
  font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;
  font-weight:700;
  line-height:1.1;
  margin:0;
  letter-spacing:-.02em
}

a{
  color:inherit;
  text-decoration:none
}

button,input,textarea,select{
  font:inherit;
  color:inherit
}

:focus-visible{
  outline:2px solid var(--ac);
  outline-offset:2px
}

.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 24px
}

.btn{
  display:inline-block;
  border:1px solid var(--line);
  background:var(--surf);
  padding:10px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:500
}

.btn.p{
  background:var(--ac);
  color:var(--acf);
  border-color:var(--ac)
}

.btn.lg{
  padding:14px 28px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  padding:20px 0
}

.logo{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;
  font-size:22px
}

.top nav{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap
}

.hero{
  padding:96px 0 72px;
  max-width:760px
}

.hero h1{
  font-size:clamp(40px,7vw,72px)
}

.hero p{
  font-size:19px;
  color:var(--mut);
  max-width:560px;
  margin:24px 0 32px
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap
}

.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:32px;
  padding:56px 0;
  border-top:1px solid var(--line)
}

.steps h3{
  font-size:18px;
  margin-bottom:8px
}

.steps p{
  color:var(--mut);
  margin:0
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px
}

.card{
  background:var(--surf);
  border:1px solid var(--line);
  border-radius:12px;
  padding:32px;
  width:100%;
  max-width:420px
}

.card h2{
  font-size:28px;
  margin-bottom:24px
}

label{
  display:block;
  font-size:14px;
  font-weight:500;
  margin:16px 0 6px
}

input,textarea,select{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--bg)
}

textarea{
  resize:vertical;
  min-height:84px
}

.note{
  color:var(--mut);
  font-size:14px;
  margin-top:20px
}

.note a{
  color:var(--ac);
  font-weight:500
}

.shell{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:100vh
}

.side{
  border-right:1px solid var(--line);
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  gap:4px
}

.side a{
  padding:9px 12px;
  border-radius:8px;
  color:var(--mut)
}

.side a.on,
.side a:hover{
  background:var(--surf);
  color:var(--fg)
}

.side .logo{
  padding:0 12px 20px
}

.main{
  padding:40px;
  min-width:0
}

.main h1{
  font-size:34px;
  margin-bottom:8px
}

.sub{
  color:var(--mut);
  margin:0 0 32px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:40px
}

.stat{
  background:var(--surf);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px
}

.stat b{
  display:block;
  font:700 30px 'Bricolage Grotesque',sans-serif
}

.stat span{
  color:var(--mut);
  font-size:14px
}

.list{
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surf)
}

.li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px 20px;
  border-bottom:1px solid var(--line)
}

.li:last-child{
  border:0
}

.li small{
  color:var(--mut);
  display:block
}

.tag{
  font-size:13px;
  padding:3px 10px;
  border-radius:99px;
  border:1px solid var(--line);
  color:var(--mut)
}

.tag.ok{
  color:#1B7A4B;
  border-color:#1B7A4B
}

.plans{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px
}

.plans ul{
  padding-left:18px;
  color:var(--mut);
  margin:12px 0 0
}

.doc h1{
  font-size:clamp(32px,5vw,44px);
  margin-bottom:8px
}

.doc h3{
  font-size:20px;
  margin:32px 0 8px
}

.doc p{
  color:var(--mut)
}

details{
  border-bottom:1px solid var(--line);
  padding:14px 0
}

summary{
  cursor:pointer;
  font-weight:500
}

details p{
  color:var(--mut);
  margin:10px 0 0
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px
}

.opt{
  background:var(--surf);
  border:1px solid var(--line);
  border-radius:12px;
  padding:24px;
  cursor:pointer;
  text-align:left;
  transition:border-color .15s,transform .2s
}

.opt:hover{
  border-color:var(--ac);
  transform:translateY(-3px)
}

.opt h3{
  font-size:20px;
  margin-bottom:6px
}

.opt p{
  margin:0;
  color:var(--mut);
  font-size:15px
}

.cat-card{
  min-height:230px;
  display:flex;
  flex-direction:column;
  justify-content:space-between
}

.cat-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px
}

.cat-number{
  width:38px;
  height:38px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--bg);
  border:1px solid var(--line);
  font-weight:600
}

.feature-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:18px
}

.feature-list span{
  font-size:12px;
  padding:4px 8px;
  border-radius:6px;
  border:1px solid var(--line);
  color:var(--mut)
}

.thumb{
  height:160px;
  border-radius:8px;
  margin-bottom:14px;
  padding:14px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:6px;
  border:1px solid var(--line);
  overflow:hidden
}

.thumb i{
  display:block;
  height:8px;
  border-radius:4px;
  opacity:.85
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:24px;
  flex-wrap:wrap
}

.tabs .btn.on{
  background:var(--fg);
  color:var(--bg);
  border-color:var(--fg)
}

.ed{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:24px;
  align-items:start
}

.panel{
  background:var(--surf);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 20px 20px
}

.section-title{
  margin:26px 0 8px;
  font-size:17px
}

.section-note{
  color:var(--mut);
  font-size:13px;
  margin:0 0 12px
}

.item-box{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin-top:10px;
  background:var(--bg)
}

.frame{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:var(--surf);
  margin:0 auto;
  transition:max-width .2s
}

.bar{
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  color:var(--mut)
}

.site{
  line-height:1.5;
  min-height:500px
}

.site a{
  text-decoration:none
}

.site nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 28px;
  font-weight:600
}

.site-nav-links{
  display:flex;
  gap:18px;
  font-size:13px;
  opacity:.65
}

.site .h{
  padding:72px 28px 60px
}

.site .h.c{
  text-align:center
}

.site h1,
.site h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  letter-spacing:.3px
}

.site h1{
  font-size:clamp(32px,5vw,52px);
  margin-bottom:12px
}

.site .h p{
  margin:0 0 24px;
  opacity:.75;
  max-width:620px
}

.site .b{
  display:inline-block;
  padding:12px 26px;
  border-radius:4px;
  font-weight:500;
  font-size:14px;
  letter-spacing:.3px
}

.site .it{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  padding:0 28px 36px
}

.site .it div{
  padding:18px;
  border-radius:8px;
  border:1px solid;
  opacity:.9
}

.site .ct{
  padding:24px 28px 36px;
  border-top:1px solid;
  font-size:14px
}

.site .category-label{
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  opacity:.55;
  margin-bottom:10px
}

.site .price{
  font-weight:600;
  margin-top:8px
}

.site .site-section-title{
  padding:28px 28px 12px
}

.site .site-section-title h2{
  font-size:30px;
  margin-bottom:4px
}

.site .site-section-title p{
  opacity:.6;
  margin:0
}

.site.style-classic nav{
  border-bottom:1px solid currentColor;
  opacity:.95
}

.site.style-elegant nav{
  padding:28px 34px
}

.site.style-elegant .h{
  padding:95px 34px 80px
}

.site.style-elegant .b{
  border-radius:99px
}

.site.style-commerce .h{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:30px;
  align-items:center
}

.site.style-commerce .hero-media{
  min-height:230px;
  border-radius:14px;
  overflow:hidden
}

.site.style-restaurant nav{
  border-bottom:1px solid currentColor;
}

.site.style-restaurant .h{
  text-align:center;
  padding:80px 28px 55px
}

.site.style-restaurant .it div{
  border-radius:0;
  border-left:0;
  border-right:0;
  border-top:0
}

.site.style-modern nav{
  padding:22px 28px;
  border-bottom:1px solid currentColor
}

.site.style-modern .h{
  background:rgba(0,0,0,.04)
}

.site.style-traditional .h{
  text-align:center
}

.site.style-beauty .h{
  text-align:center
}

.site.style-beauty .b{
  border-radius:99px
}

.site.style-studio .h{
  padding:55px 28px 45px
}

.site.style-premium .h{
  text-align:center;
  padding:90px 28px 65px
}

.site.style-corporate .h{
  padding:55px 28px
}

.site.style-creative .h{
  padding:90px 28px 50px
}

.site.style-business .h{
  background:rgba(0,0,0,.04)
}

.site.style-hotel .h{
  text-align:center;
  padding:90px 28px 65px
}

.site.style-luxury .h{
  text-align:center;
  padding:105px 28px 70px
}

.site.style-stay .h{
  padding:60px 28px
}

.site.style-portfolio .it{
  grid-template-columns:repeat(2,1fr)
}

.site.style-gallery .it{
  grid-template-columns:repeat(3,1fr)
}

.site.style-photo-studio .h{
  padding:55px 28px
}

.site.style-cosmetics .h{
  text-align:center
}

.site.style-beauty-shop .it div{
  border-radius:14px
}

.site.style-beauty-premium .h{
  text-align:center;
  padding:90px 28px 60px
}

.pub{
  max-width:520px
}

.sd{
  display:flex;
  align-items:center;
  gap:0
}

.sd input{
  border-radius:8px 0 0 8px
}

.sd span{
  padding:11px 12px;
  border:1px solid var(--line);
  border-left:0;
  border-radius:0 8px 8px 0;
  color:var(--mut);
  white-space:nowrap
}

.ok-box{
  border:1px solid #1B7A4B;
  border-radius:12px;
  padding:24px
}

@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

#app>*{
  animation:fade .25s ease
}

.hero h1,
.hero p,
.hero .row{
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both
}

.hero h1{animation-delay:.05s}
.hero p{animation-delay:.18s}
.hero .row{animation-delay:.3s}

.auth .card{
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both
}

.btn{
  transition:transform .15s,background .15s,border-color .15s
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--ac)
}

.btn:active{
  transform:scale(.98)
}

.side a{
  transition:background .15s,color .15s
}

details[open] p,
.ok-box,
#cf h3{
  animation:rise .35s ease both
}

@media(max-width:820px){
  .steps{
    grid-template-columns:1fr 1fr
  }

  .plans{
    grid-template-columns:1fr
  }

  .stats{
    grid-template-columns:1fr
  }

  .shell{
    grid-template-columns:1fr
  }

  .side{
    flex-direction:row;
    overflow-x:auto;
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:12px
  }

  .side .logo{
    padding:0 12px 0 0;
    align-self:center
  }

  .side a{
    white-space:nowrap
  }

  .main{
    padding:24px 16px
  }

  .ed{
    grid-template-columns:1fr
  }

  .site .it{
    grid-template-columns:1fr
  }

  .site.style-commerce .h{
    grid-template-columns:1fr
  }

  .site.style-portfolio .it,
  .site.style-gallery .it{
    grid-template-columns:1fr
  }

  .hero{
    padding:56px 0 40px
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    transition:none!important;
    animation:none!important
  }
}
</style>
</head>

var $=function(s){
  return document.querySelector(s)
};

function tpl(){
  return TPL.filter(function(t){
    return t.id===S.tpl
  })[0]||TPL[0]
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c]
  })
}

function bind(k){
  return 'oninput="S.'+k+'=this.value;upd()"'
}

function waLink(){
  if(!S.wa)return '';

  var d=S.wa.replace(/[^0-9]/g,'');

  return 'https://wa.me/'+d+
    '?text='+encodeURIComponent(S.wam||'Bonjour')
}

function pal(){
  var p=PAL[S.pal||0];

  return (p&&p.bg)?p:null
}

function category(){
  return CATS[tpl().c]||CATS.boutique
}


/* =========================================================
   ITEMS
========================================================= */

function ensureItems(){

  if(!S.it||!S.it.length){

    var c=category();

    S.it=c.items.map(function(x){
      return {
        t:x,
        d:'',
        img:'',
        price:'',
        category:'',
        extra:''
      }
    })
  }

  return S.it
}

function getIt(i){
  return ensureItems()[i]
}

function setIt(i,k,v){
  ensureItems();
  S.it[i][k]=v;
  upd()
}

function addItem(){
  ensureItems();

  S.it.push({
    t:'Nouveau',
    d:'',
    img:'',
    price:'',
    category:'',
    extra:''
  });

  persist();
  reRender()
}

function removeItem(i){
  ensureItems();

  if(S.it.length<=1)return;

  S.it.splice(i,1);

  persist();
  reRender()
}

function site(){

  var t=tpl();
  var c=CATS[t.c];
  var p=pal();

  var bg=(p&&p.bg)||t.bg;
  var fg=(p&&p.fg)||t.fg;
  var ac=S.color||(p&&p.ac)||t.ac;

  var dark=/^#(0|1)/.test(bg);

  var btnFg=dark?bg:'#fff';

  var link=waLink();

  var ctaText=c.b;

  var cta=link
    ?'<a class="b" href="'+link+'" target="_blank" rel="noopener" style="background:'+ac+';color:'+btnFg+'">'+esc(ctaText)+'</a>'
    :'<span class="b" style="background:'+ac+';color:'+btnFg+'">'+esc(ctaText)+'</span>';

  var heroImage=S.img
    ?'<div class="hero-media"><img src="'+S.img+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>'
    :'';

  var items=ensureItems();

  var cards=items.map(function(x){

    var title=esc(x.t);

    var description=esc(
      x.d||'Description à personnaliser'
    );

    var price=x.price
      ?'<div class="price">'+esc(x.price)+'</div>'
      :'';

    var image=x.img
      ?'<img src="'+x.img+'" alt="" style="width:100%;height:130px;object-fit:cover;border-radius:7px;margin-bottom:12px">'
      :'';

    return '<div style="border-color:'+ac+'55">'+
      image+
      '<b>'+title+'</b>'+
      '<br>'+
      '<span style="opacity:.6;font-size:14px">'+description+'</span>'+
      price+
      '</div>'
  }).join('');

  var contact=[
    S.phone,
    S.hours,
    S.email,
    S.addr,
    S.ig&&'Instagram '+S.ig,
    S.fb&&'Facebook '+S.fb
  ].filter(Boolean);

  var navLinks=
    '<span class="site-nav-links">'+
      '<span>Accueil</span>'+
      '<span>'+esc(c.item)+'s</span>'+
      '<span>Contact</span>'+
    '</span>';

  var categoryLabel=
    '<div class="category-label">'+esc(c.n)+'</div>';

  var hero=
    '<div class="h '+(t.style==='restaurant'||t.style==='beauty'||t.style==='premium'||t.style==='hotel'||t.style==='luxury'||t.style==='portfolio'?'c':'')+'">'+
      '<div>'+
        categoryLabel+
        '<h1>'+esc(S.slogan)+'</h1>'+
        '<p>'+esc(S.desc)+'</p>'+
        cta+
      '</div>'+
      heroImage+
    '</div>';

  var sectionTitle=
    '<div class="site-section-title">'+
      '<h2>'+esc(c.item)+'s</h2>'+
      '<p>'+esc(c.d)+'</p>'+
    '</div>';

  var special='';

  /* BOUTIQUE */
  if(t.c==='boutique'){
    special=
      '<div class="site-section-title">'+
        '<h2>Nos produits</h2>'+
        '<p>Découvrez notre sélection.</p>'+
      '</div>';
  }

  /* RESTAURANT */
  if(t.c==='restaurant'){
    special=
      '<div class="site-section-title">'+
        '<h2>Notre menu</h2>'+
        '<p>Une sélection préparée avec soin.</p>'+
      '</div>';
  }

  /* SALON */
  if(t.c==='salon'){
    special=
      '<div class="site-section-title">'+
        '<h2>Nos services</h2>'+
        '<p>Découvrez nos prestations et prenez rendez-vous.</p>'+
      '</div>';
  }

  /* AGENCE */
  if(t.c==='agence'){
    special=
      '<div class="site-section-title">'+
        '<h2>Nos services</h2>'+
        '<p>Des solutions adaptées à votre entreprise.</p>'+
      '</div>';
  }

  /* HOTEL */
  if(t.c==='hotel'){
    special=
      '<div class="site-section-title">'+
        '<h2>Nos chambres</h2>'+
        '<p>Choisissez le séjour qui vous convient.</p>'+
      '</div>';
  }

  /* PHOTOGRAPHE */
  if(t.c==='photographe'){
    special=
      '<div class="site-section-title">'+
        '<h2>Portfolio</h2>'+
        '<p>Découvrez nos réalisations.</p>'+
      '</div>';
  }

  /* BEAUTÉ */
  if(t.c==='beaute'){
    special=
      '<div class="site-section-title">'+
        '<h2>Notre sélection</h2>'+
        '<p>Produits et soins pour votre beauté.</p>'+
      '</div>';
  }

  return '<div class="site style-'+t.style+'" style="background:'+bg+';color:'+fg+';font-family:'+t.ff+';position:relative">'+

    '<nav>'+
      '<span>'+
        (S.logo
          ?'<img src="'+S.logo+'" alt="" style="height:30px;max-width:120px;object-fit:contain;vertical-align:middle;margin-right:9px">'
          :''
        )+
        esc(S.name)+
      '</span>'+
      navLinks+
    '</nav>'+

    hero+

    special+

    '<div class="it">'+cards+'</div>'+

    '<div class="ct" style="border-color:'+ac+'44">'+
      contact.map(function(x){
        return esc(x)
      }).join(' &nbsp;|&nbsp; ')+
    '</div>'+

    (link
      ?'<a href="'+link+'" target="_blank" rel="noopener" style="position:absolute;bottom:16px;right:16px;background:#25D366;color:#fff;border-radius:99px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2)">WhatsApp</a>'
      :''

/* =========================================================
   UPLOAD
========================================================= */

function up(k,el,idx){

  var f=el.files[0];

  if(!f)return;

  if(f.size>2000000){

    el.value='';

    if(el.previousElementSibling){
      el.previousElementSibling.textContent=
        'Fichier trop lourd : 2 Mo maximum';
    }

    return
  }

  function apply(url){

    if(idx!=null){

      ensureItems();

      S.it[idx].img=url

    }else{

      S[k]=url

    }

    upd()
  }

  if(sb&&S.uid){

    var pa=
      S.uid+'/'+
      (S.sid||'x')+'-'+
      (idx!=null?'item'+idx:k)+'-'+
      Date.now();

    sb.storage
      .from('webora-media')
      .upload(pa,f,{
        contentType:f.type
      })
      .then(function(r){

        if(r.error){

          if(el.previousElementSibling){
            el.previousElementSibling.textContent=
              'Envoi impossible.';
          }

          return
        }

        apply(
          sb.storage
            .from('webora-media')
            .getPublicUrl(pa)
            .data
            .publicUrl
        )

      });

    return
  }

  var r=new FileReader();

  r.onload=function(){
    apply(r.result)
  };

  r.readAsDataURL(f)
}

    'projects',
    'portfolio',
    'order',
    'delivery'
  ].forEach(function(k){

    o[k]=S[k]

  });

  return o
}


/* =========================================================
   SITES
========================================================= */

function sites(){

  if(sb){

    return (S.remote||[]).map(function(x){

      return {
        id:x.id,
        n:x.name,
        u:x.subdomain
          ?x.subdomain+'.webora.com'
          :'-',
        s:x.published
          ?'Publié'
          :'Brouillon',
        v:''
      }

    })
  }

  return (
    S.live
      ?[
        {
          n:S.name,
          u:S.sub+'.webora.com',
          s:'Publié',
          v:'0 visite'
        }
      ]
      :[]
  ).concat(SITES)
}


/* =========================================================
   ABONNEMENT
========================================================= */

function ensureSub(uid){

  return sb
    .from('webora_subscriptions')
    .select('id')
    .eq('user_id',uid)
    .maybeSingle()
    .then(function(r){

      if(r.data)return;

      var now=new Date();

      return sb
        .from('webora_subscriptions')
        .insert({
          user_id:uid,
          plan:'basique',
          status:'active',
          starts_at:now.toISOString(),
          free_until:new Date(
            now.getTime()+30*864e5
          ).toISOString(),
          ends_at:new Date(
            now.getTime()+90*864e5
          ).toISOString()
        })
    })
}


/* =========================================================
   CHARGER LES SITES
========================================================= */

function loadSites(){

  return sb
    .from('webora_sites')
    .select('id,name,subdomain,published')
    .eq('owner',S.uid)
    .order('updated_at',{ascending:false})
    .then(function(r){

      S.remote=r.data||[]

    })
}


/* =========================================================
   DÉCONNEXION
========================================================= */

function logout(){

  S.logged=false;
  S.uid=null;
  S.sid=null;
  S.remote=[];

  if(sb)sb.auth.signOut()
}


/* =========================================================
   NOUVEAU SITE
========================================================= */

function newSite(){

  Object.assign(
    S,
    {
      sid:null,
      pub:false,
      name:'Mon activité',
      slogan:'Votre slogan ici',
      desc:'Décrivez votre activité en quelques mots.',
      logo:'',
      img:'',
      it:null,
      sub:'',
      reservation:'',
      services:'',
      rooms:'',
      projects:'',
      portfolio:'',
      order:'',
      delivery:''
    }
  );

  if(!sb){

    go('editeur');

    return
  }

  sb
    .from('webora_sites')
    .insert({
      name:S.name,
      template:S.tpl,
      category:tpl().c,
      content:content()
    })
    .select('id')
    .single()
    .then(function(r){

      if(r.data){

        S.sid=r.data.id;
        go('editeur')

      }else{

        alert(
          r.error
            ?r.error.message
            :'Impossible de créer le site.'
        )

      }

    })
}


/* =========================================================
   CHANGEMENT DE MODÈLE
========================================================= */

function changeTpl(){

  S.chg=0;

  /* on garde les contenus existants */

  persist();

  go('editeur')
}


/* =========================================================
   OUVRIR UN SITE
========================================================= */

function openSite(id){

  sb
    .from('webora_sites')
    .select('*')
    .eq('id',id)
    .eq('owner',S.uid)
    .single()
    .then(function(r){

      if(r.error)return;

      var d=r.data;

      Object.assign(
        S,
        {
          sid:d.id,
          name:d.name,
          tpl:d.template,
          cat:d.category,
          sub:d.subdomain||'',
          pub:!!d.published,
          it:null
        },
        d.content||{}
      );

      go('editeur')

    })
}


/* =========================================================
   SAUVEGARDE
========================================================= */

function persist(){

  if(
    !sb||
    !S.logged||
    !S.sid
  )return;

  clearTimeout(persist.t);

  persist.t=setTimeout(function(){

    sb
      .from('webora_sites')
      .update({
        name:S.name,
        template:S.tpl,
        category:tpl().c,
        content:content()
      })
      .eq('id',S.sid)
      .eq('owner',S.uid)
      .then(function(){})

  },800)
}


/* =========================================================
   APERÇU PUBLIC
========================================================= */

function nf(){

  $('#app').innerHTML=
    head()+
    '<section class="hero">'+
      '<h1>Site introuvable</h1>'+
      '<p>Cette adresse n’existe pas ou n’est pas publiée.</p>'+
    '</section>'+
    '</div>'
}


function viewSite(x){

  var show=function(d){

    var bak=Object.assign({},S);

    Object.assign(
      S,
      {
        name:d.name,
        tpl:d.template
      },
      d.content||{}
    );

    var h=site();

    Object.assign(S,bak);

    $('#app').innerHTML=
      h+
      '<p style="text-align:center;padding:16px;font-size:13px;color:var(--mut)">Créé avec Webora</p>'
  };

  if(!sb){

    if(x===S.sub){

      show({
        name:S.name,
        template:S.tpl,
        content:content()
      })

    }else{

      nf()

    }

    return
  }

  sb
    .from('webora_sites')
    .select('name,template,content')
    .eq('subdomain',x)
    .eq('published',true)
    .maybeSingle()
    .then(function(r){

      if(r.data)show(r.data);
      else nf()

    })
}


/* =========================================================
   MISE À JOUR
========================================================= */

function upd(){

  save();
  persist();

  var l=$('#live');

  if(l){

    l.innerHTML=site()

  }
}


/* =========================================================
   ROUTES
========================================================= */

function go(r){

  location.hash='#/'+r
}

function routeTo(r){

  location.hash='#/'+r
}

function reRender(){

  var r=
    location.hash.replace(/^#\/?/,'')||'';

  if(!V[r])r='';

  $('#app').innerHTML=V[r]();

  anim()
}


function route(){

  var m=
    location.hash.match(/^#\/s\/([a-z0-9-]+)/);

  if(m){

    viewSite(m[1]);

    return
  }

  var r=
    location.hash.replace(/^#\/?/,'')||'';

  if(!V[r])r='';

  if(
    PROT.indexOf(r)>-1 &&
    !S.logged
  ){

    go('connexion');

    return
  }

  $('#app').innerHTML=V[r]();

  window.scrollTo(0,0);

  anim();

  save()
}


/* =========================================================
   AUTHENTIFICATION
========================================================= */

function auth(su){

  var e=$('#e').value.trim();
  var p=$('#p').value;

  if(!/^\S+@\S+\.\S+$/.test(e)){

    $('#er').textContent=
      'Entrez une adresse e-mail valide.';

    return
  }

  if(p.length<6){

    $('#er').textContent=
      'Le mot de passe doit contenir au moins 6 caractères.';

    return
  }

  if(!sb){

    S.logged=true;

    go('dashboard');

    return
  }

  var n=
    su
      ?$('#n').value.trim()
      :'';

  (
    su

      ?sb.auth.signUp({
        email:e,
        password:p,
        options:{
          data:{
            full_name:n
          }
        }
      })

      :sb.auth.signInWithPassword({
        email:e,
        password:p
      })

  ).then(function(r){

    if(r.error){

      $('#er').textContent=
        su
          ?'Inscription impossible : '+r.error.message
          :'Adresse e-mail ou mot de passe incorrect.';

      return
    }

    if(!r.data.session){

      $('#er').textContent=
        'Compte créé. Vérifiez votre e-mail pour le confirmer, puis connectez-vous.';

      return
    }

    S.logged=true;
    S.uid=r.data.session.user.id;

    ensureSub(S.uid)
      .then(loadSites)
      .then(function(){

        go('dashboard')

      })

  })
}


/* =========================================================
   PUBLICATION
========================================================= */

function publish(){

  if(S.sub.length<3){

    $('#er').textContent=
      'L’adresse doit contenir au moins 3 caractères.';

    return
  }

  if(!sb){

    S.pub=true;
    S.live=1;

    route();

    return
  }

  if(!S.sid){

    $('#er').textContent=
      'Créez d’abord un site depuis « Nouveau site ».';

    return
  }

  sb
    .from('webora_sites')
    .update({
      subdomain:S.sub,
      published:true,
      name:S.name,
      template:S.tpl,
      category:tpl().c,
      content:content()
    })
    .eq('id',S.sid)
    .eq('owner',S.uid)
    .then(function(r){

      if(r.error){

        $('#er').textContent=
          r.error.code==='23505'
            ?'Cette adresse est déjà utilisée.'
            :'Publication impossible, réessayez.';

        return
      }

      S.pub=true;

      loadSites().then(route)

    })
}


/* =========================================================
   ANIMATIONS
========================================================= */

function anim(){

  if(
    matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches
  )return;

  document
    .querySelectorAll('.stat b')
    .forEach(function(b){

      var n=
        parseInt(
          b.textContent.replace(/\s/g,''),
          10
        );

      var t0=null;

      if(isNaN(n))return;

      function f(t){

        t0=t0||t;

        var k=
          Math.min(
            (t-t0)/700,
            1
          );

        b.textContent=
          Math.round(
            n*(1-Math.pow(1-k,3))
          ).toLocaleString('fr-FR');

        if(k<1)
          requestAnimationFrame(f)
      }

      requestAnimationFrame(f)
    });


  if(!('IntersectionObserver' in window))
    return;

  var io=
    new IntersectionObserver(
      function(es){

        es.forEach(function(e){

          if(e.isIntersecting){

            e.target.classList.add('in');

            io.unobserve(e.target)

          }

        })

      },
      {threshold:.15}
    );


  document
    .querySelectorAll(
      '.steps>div,.plans>.stat'
    )
    .forEach(function(el,i){

      el.classList.add('rv');

      el.style.transitionDelay=
        (i%4)*80+'ms';

      io.observe(el)

    })
}


/* =========================================================
   ROUTES PROTÉGÉES
========================================================= */

var PROT=[
  'dashboard',
  'categories',
  'modeles',
  'editeur',
  'apercu',
  'publication'
];


/* =========================================================
   RESTAURATION LOCAL STORAGE
========================================================= */

try{

  Object.assign(
    S,
    JSON.parse(
      localStorage.getItem('webora')||'{}'
    )
  )

}catch(e){}


/* =========================================================
   HASH CHANGE
========================================================= */

window.addEventListener(
  'hashchange',
  route
);


/* =========================================================
   SESSION SUPABASE
========================================================= */

if(sb){

  sb.auth
    .getSession()
    .then(function(r){

      var u=
        r.data.session&&
        r.data.session.user;

      S.logged=!!u;

      S.uid=
        u
          ?u.id
          :null;

      return u
        ?ensureSub(u.id).then(loadSites)
        :0

    })
    .then(route)

}else{

  route()

}

</script>
