<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Webora</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FA;--surf:#fff;--fg:#14181F;--mut:#5B6472;--line:#E3E6EB;--ac:#2A3BE8;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1218;--surf:#171B23;--fg:#ECEEF2;--mut:#98A1B0;--line:#262C38;--ac:#7B88FF;--acf:#0F1218}}
:root[data-theme="dark"]{--bg:#0F1218;--surf:#171B23;--fg:#ECEEF2;--mut:#98A1B0;--line:#262C38;--ac:#7B88FF;--acf:#0F1218}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700;line-height:1.1;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--surf);padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.btn.lg{padding:14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px}
.top nav{display:flex;gap:12px;align-items:center}
.hero{padding:96px 0 72px;max-width:760px}
.hero h1{font-size:clamp(40px,7vw,72px)}
.hero p{font-size:19px;color:var(--mut);max-width:560px;margin:24px 0 32px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;padding:56px 0;border-top:1px solid var(--line)}
.steps h3{font-size:18px;margin-bottom:8px}.steps p{color:var(--mut);margin:0}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:420px}
.card h2{font-size:28px;margin-bottom:24px}
label{display:block;font-size:14px;font-weight:500;margin:16px 0 6px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{resize:vertical;min-height:84px}
.note{color:var(--mut);font-size:14px;margin-top:20px}
.note a{color:var(--ac);font-weight:500}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.side a{padding:9px 12px;border-radius:8px;color:var(--mut)}
.side a.on,.side a:hover{background:var(--surf);color:var(--fg)}
.side .logo{padding:0 12px 20px}
.main{padding:40px;min-width:0}
.main h1{font-size:34px;margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 32px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px}
.stat b{display:block;font:700 30px 'Bricolage Grotesque',sans-serif}.stat span{color:var(--mut);font-size:14px}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li small{color:var(--mut);display:block}
.tag{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:#1B7A4B;border-color:#1B7A4B}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.plans ul{padding-left:18px;color:var(--mut);margin:12px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.opt{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:24px;cursor:pointer;text-align:left;transition:border-color .15s}
.opt:hover{border-color:var(--ac)}
.opt h3{font-size:20px;margin-bottom:6px}.opt p{margin:0;color:var(--mut);font-size:15px}
.thumb{height:150px;border-radius:8px;margin-bottom:14px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;border:1px solid var(--line)}
.thumb i{display:block;height:8px;border-radius:4px;opacity:.85}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tabs .btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ed{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px 20px 20px}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf);margin:0 auto;transition:max-width .2s}
.bar{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.site{line-height:1.5}
.site nav{display:flex;justify-content:space-between;padding:18px 28px;font-weight:600}
.site .h{padding:56px 28px 48px}.site .h.c{text-align:center}
.site h1{font-size:clamp(28px,4vw,44px);margin-bottom:10px}
.site .h p{margin:0 0 20px;opacity:.75}
.site .b{display:inline-block;padding:10px 20px;border-radius:6px;font-weight:600}
.site .it{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 28px 32px}
.site .it div{padding:18px;border-radius:8px;border:1px solid;opacity:.9}
.site .ct{padding:24px 28px 36px;border-top:1px solid;font-size:14px}
.pub{max-width:520px}
.sd{display:flex;align-items:center;gap:0}
.sd input{border-radius:8px 0 0 8px}.sd span{padding:11px 12px;border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;color:var(--mut);white-space:nowrap}
.ok-box{border:1px solid #1B7A4B;border-radius:12px;padding:24px}
@media(max-width:820px){
.steps{grid-template-columns:1fr 1fr}.plans{grid-template-columns:1fr}.stats{grid-template-columns:1fr}
.shell{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
.side .logo{padding:0 12px 0 0;align-self:center}.side a{white-space:nowrap}
.main{padding:24px 16px}.ed{grid-template-columns:1fr}.site .it{grid-template-columns:1fr}.hero{padding:56px 0 40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CATS={
boutique:{n:'Boutique',d:'Vendez vos produits en ligne',it:['Produit phare','Nouveautés','Promotions'],b:'Voir la collection'},
restaurant:{n:'Restaurant',d:'Menu, horaires et réservations',it:['Entrées','Plats','Desserts'],b:'Voir le menu'},
salon:{n:'Salon',d:'Services et prise de rendez-vous',it:['Coiffure','Soins','Beauté'],b:'Prendre rendez-vous'},
};
var TPL=[
{id:'atelier',c:'boutique',n:'Atelier',bg:'#FFFFFF',fg:'#1A1A1A',ac:'#1A1A1A',ff:'Georgia,serif',l:'c'},
{id:'vitrine',c:'boutique',n:'Vitrine',bg:'#F3EFE8',fg:'#3B2F26',ac:'#8A5A2B',ff:'system-ui,sans-serif',l:'s'},
{id:'minimal',p:1,c:'boutique',n:'Minimal',bg:'#0E0E10',fg:'#F2F2F2',ac:'#E8E8E8',ff:'system-ui,sans-serif',l:'c'},
{id:'bistro',c:'restaurant',n:'Bistro',bg:'#FBF6EE',fg:'#2B1B14',ac:'#B23A22',ff:'Georgia,serif',l:'c'},
{id:'table',p:1,c:'restaurant',n:'Table',bg:'#16201B',fg:'#EEF2EC',ac:'#C9A96A',ff:'Georgia,serif',l:'s'},
{id:'saveur',c:'restaurant',n:'Saveur',bg:'#FFF8E7',fg:'#2A2A2A',ac:'#E07A1F',ff:'system-ui,sans-serif',l:'s'},
{id:'douceur',c:'salon',n:'Douceur',bg:'#FAF0F0',fg:'#3A2A2E',ac:'#B8607A',ff:'Georgia,serif',l:'c'},
{id:'studio',c:'salon',n:'Studio',bg:'#F2F4F3',fg:'#1D2A26',ac:'#2F6B5A',ff:'system-ui,sans-serif',l:'s'},
{id:'eclat',p:1,c:'salon',n:'Éclat',bg:'#F7F1FA',fg:'#2B1B33',ac:'#7A3FA0',ff:'system-ui,sans-serif',l:'s'}];
var S={cat:'boutique',tpl:'atelier',name:'Maison Delva',slogan:'Des produits choisis avec soin',desc:'Nous accompagnons nos clients depuis 2019.',color:'',phone:'+509 0000 0000',email:'contact@exemple.com',wa:'',addr:'',ig:'',fb:'',logo:'',img:'',q:'',f:'',sub:'',logged:false,pub:false,dev:'d'};
var SITES=[{n:'Kédassa Bazar',u:'kedassa.webora.com',s:'Publié',v:'1 240 visites'},{n:'Neyoo',u:'neyoo.webora.com',s:'Publié',v:'860 visites'},{n:'Brouillon salon',u:'-',s:'Brouillon',v:'-'}];
var $=function(s){return document.querySelector(s)};
function tpl(){return TPL.filter(function(t){return t.id===S.tpl})[0]||TPL[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bind(k){return 'oninput="S.'+k+'=this.value;upd()"'}
function site(){
var t=tpl(),c=CATS[t.c],ac=S.color||t.ac,txt=(t.bg==='#0E0E10'||t.bg==='#16201B')?t.fg:t.fg;
var btnFg=(t.bg==='#0E0E10')?'#0E0E10':'#fff';
return '<div class="site" style="background:'+t.bg+';color:'+t.fg+';font-family:'+t.ff+'">'+
'<nav><span>'+(S.logo?'<img src="'+S.logo+'" alt="" style="height:26px;vertical-align:middle;margin-right:8px">':'')+esc(S.name)+'</span><span style="opacity:.6;font-weight:400">Accueil &nbsp; À propos &nbsp; Contact</span></nav>'+
'<div class="h '+(t.l==='c'?'c':'')+'"><h1>'+esc(S.slogan)+'</h1><p>'+esc(S.desc)+'</p><span class="b" style="background:'+ac+';color:'+btnFg+'">'+c.b+'</span></div>'+
(S.img?'<img src="'+S.img+'" alt="" style="width:100%;max-height:220px;object-fit:cover;display:block;margin-bottom:24px">':'')+'<div class="it">'+c.it.map(function(i){return '<div style="border-color:'+ac+'55"><b>'+i+'</b><br><span style="opacity:.6;font-size:14px">Description à personnaliser</span></div>'}).join('')+'</div>'+
'<div class="ct" style="border-color:'+ac+'44">'+[S.phone,S.wa&&'WhatsApp '+S.wa,S.email,S.addr,S.ig&&'Instagram '+S.ig,S.fb&&'Facebook '+S.fb].filter(Boolean).map(function(x){return esc(x)}).join(' &nbsp;|&nbsp; ')+'</div></div>'}
function thumb(t){return '<div class="thumb" style="background:'+t.bg+'"><i style="background:'+t.fg+';width:60%"></i><i style="background:'+t.ac+';width:30%"></i><i style="background:'+t.fg+';width:80%;opacity:.3"></i></div>'}
function shell(on,body){
var L=[['dashboard','Tableau de bord'],['categories','Nouveau site'],['editeur','Éditeur'],['apercu','Aperçu'],['publication','Publication'],['parametres','Paramètres']];
return '<div class="shell"><aside class="side"><a class="logo" href="#/">Webora</a>'+L.map(function(l){return '<a href="#/'+l[0]+'" class="'+(l[0]===on?'on':'')+'">'+l[1]+'</a>'}).join('')+'<a href="#/" onclick="S.logged=false" style="margin-top:auto">Déconnexion</a></aside><main class="main">'+body+'</main></div>'}
function head(){return '<div class="wrap"><div class="top"><a class="logo" href="#/">Webora</a><nav><a class="btn" href="#/connexion">Connexion</a><a class="btn p" href="#/inscription">Créer un compte</a></nav></div>'}
var V={
'':function(){return head()+'<section class="hero"><h1>Votre site professionnel, en quelques minutes.</h1><p>Choisissez un modèle, personnalisez vos textes et vos couleurs, puis publiez. Aucun code nécessaire.</p><div class="row"><a class="btn p lg" href="#/inscription">Commencer gratuitement</a><a class="btn lg" href="#/connexion">Se connecter</a></div></section>'+
'<section class="steps"><div><h3>Choisissez</h3><p>Boutique, restaurant ou salon de beauté.</p></div><div><h3>Sélectionnez</h3><p>Neuf modèles conçus pour votre activité.</p></div><div><h3>Personnalisez</h3><p>Textes, couleurs et coordonnées en direct.</p></div><div><h3>Publiez</h3><p>Une adresse en votre-nom.webora.com.</p></div></section><section style="padding:56px 0 96px;border-top:1px solid var(--line)"><h2 style="font-size:32px;margin-bottom:24px">Trois plans, un point de départ gratuit</h2><div class="plans"><div class="stat"><h3>FREE</h3><ul><li>Un site</li><li>Sous-domaine webora.com</li><li>Modèles gratuits</li><li>Branding Webora</li></ul></div><div class="stat"><h3>PRO</h3><ul><li>Domaine personnalisé</li><li>Modèles premium</li><li>Sans branding</li><li>Statistiques</li></ul></div><div class="stat"><h3>BUSINESS</h3><ul><li>Plusieurs sites</li><li>Catalogue et boutique en ligne</li><li>Statistiques avancées</li></ul></div></div><p class="note">Tarifs communiqués prochainement.</p></section></div>'},
'inscription':function(){return '<div class="auth"><div class="card"><h2>Créer un compte</h2><label>Nom complet</label><input id="n" autocomplete="name"><label>Adresse e-mail</label><input id="e" type="email" autocomplete="email"><label>Mot de passe</label><input id="p" type="password" autocomplete="new-password"><p id="er" class="note" style="color:#C0392B;margin:12px 0 0"></p><button class="btn p" style="width:100%;margin-top:20px" onclick="auth(1)">Créer mon compte</button><p class="note">Déjà inscrit ? <a href="#/connexion">Se connecter</a></p></div></div>'},
'connexion':function(){return '<div class="auth"><div class="card"><h2>Connexion</h2><label>Adresse e-mail</label><input id="e" type="email" autocomplete="email"><label>Mot de passe</label><input id="p" type="password" autocomplete="current-password"><p id="er" class="note" style="color:#C0392B;margin:12px 0 0"></p><button class="btn p" style="width:100%;margin-top:20px" onclick="auth(0)">Se connecter</button><p class="note">Pas encore de compte ? <a href="#/inscription">Créer un compte</a></p></div></div>'},
'dashboard':function(){return shell('dashboard','<h1>Tableau de bord</h1><p class="sub">Vos sites et leur activité.</p><div class="stats"><div class="stat"><b>'+SITES.length+'</b><span>Sites</span></div><div class="stat"><b>2</b><span>Publiés</span></div><div class="stat"><b>2 100</b><span>Visites ce mois</span></div></div><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px"><h3>Mes sites</h3><a class="btn p" href="#/categories">Nouveau site</a></div><div class="list">'+SITES.map(function(s){return '<div class="li"><div><b>'+s.n+'</b><small>'+s.u+' &nbsp; '+s.v+'</small></div><span class="tag '+(s.s==='Publié'?'ok':'')+'">'+s.s+'</span></div>'}).join('')+'</div>')},
'categories':function(){return shell('categories','<h1>Quel type de site ?</h1><p class="sub">Choisissez la catégorie qui correspond à votre activité.</p><div class="grid">'+Object.keys(CATS).map(function(k){return '<button class="opt" onclick="S.cat=\''+k+'\';go(\'modeles\')"><h3>'+CATS[k].n+'</h3><p>'+CATS[k].d+'</p></button>'}).join('')+'</div>')},
'modeles':function(){var q=S.q.toLowerCase(),list=TPL.filter(function(t){return (S.cat==='tous'||t.c===S.cat)&&(!q||(t.n+' '+CATS[t.c].n).toLowerCase().indexOf(q)>-1)&&(!S.f||(S.f==='p')===!!t.p)});
return shell('categories','<h1>Choisissez un modèle</h1><p class="sub">9 modèles disponibles. Vous pourrez tout modifier ensuite.</p><div class="tabs"><button class="btn '+(S.cat==='tous'?'on':'')+'" onclick="S.cat=\'tous\';route()">Tous</button>'+Object.keys(CATS).map(function(k){return '<button class="btn '+(S.cat===k?'on':'')+'" onclick="S.cat=\''+k+'\';route()">'+CATS[k].n+'</button>'}).join('')+'</div><div class="row" style="margin-bottom:24px"><input type="search" placeholder="Rechercher un modèle" value="'+esc(S.q)+'" onchange="S.q=this.value;route()" style="max-width:280px"><select onchange="S.f=this.value;route()" style="max-width:180px"><option value="">Tous</option><option value="g"'+(S.f==='g'?' selected':'')+'>Gratuits</option><option value="p"'+(S.f==='p'?' selected':'')+'>Premium</option></select></div><div class="grid">'+list.map(function(t){return '<button class="opt" onclick="S.tpl=\''+t.id+'\';S.color=\'\';go(\'editeur\')">'+thumb(t)+'<h3>'+t.n+'</h3><p>'+CATS[t.c].n+' <span class="tag">'+(t.p?'Premium':'Gratuit')+'</span></p></button>'}).join('')+'</div>'+(list.length?'':'<p class="sub">Aucun modèle ne correspond à cette recherche.</p>'))},
'editeur':function(){var t=tpl();return shell('editeur','<h1>Éditeur</h1><p class="sub">Modèle '+t.n+'. Les modifications apparaissent en direct.</p><div class="ed"><div class="panel"><label>Nom de l\'activité</label><input value="'+esc(S.name)+'" '+bind('name')+'><label>Slogan</label><input value="'+esc(S.slogan)+'" '+bind('slogan')+'><label>Description</label><textarea '+bind('desc')+'>'+esc(S.desc)+'</textarea><label>Couleur d\'accent</label><input type="color" value="'+(S.color||t.ac)+'" style="height:44px;padding:4px" oninput="S.color=this.value;upd()"><label>Téléphone</label><input value="'+esc(S.phone)+'" '+bind('phone')+'><label>E-mail</label><input value="'+esc(S.email)+'" '+bind('email')+'><label>WhatsApp</label><input value="'+esc(S.wa)+'" '+bind('wa')+'><label>Adresse</label><input value="'+esc(S.addr)+'" '+bind('addr')+'><label>Instagram</label><input value="'+esc(S.ig)+'" '+bind('ig')+'><label>Facebook</label><input value="'+esc(S.fb)+'" '+bind('fb')+'><label>Logo (2 Mo maximum)</label><input type="file" accept="image/*" onchange="up(\'logo\',this)"><label>Image principale (2 Mo maximum)</label><input type="file" accept="image/*" onchange="up(\'img\',this)"><div class="row" style="margin-top:20px"><a class="btn" href="#/modeles">Changer de modèle</a><a class="btn p" href="#/apercu">Aperçu</a></div></div><div class="frame"><div class="bar">Aperçu en direct</div><div id="live">'+site()+'</div></div></div>')},
'apercu':function(){return shell('apercu','<div class="row" style="justify-content:space-between;align-items:center"><div><h1>Aperçu</h1><p class="sub">Vérifiez le rendu avant de publier.</p></div><div class="row"><button class="btn '+(S.dev==='d'?'on':'')+'" onclick="S.dev=\'d\';route()">Ordinateur</button><button class="btn '+(S.dev==='m'?'on':'')+'" onclick="S.dev=\'m\';route()">Mobile</button><a class="btn" href="#/editeur">Modifier</a><a class="btn p" href="#/publication">Continuer</a></div></div><div class="frame" style="max-width:'+(S.dev==='m'?'380px':'100%')+'"><div class="bar">'+(esc(S.sub||'monsite')+'.webora.com')+'</div>'+site()+'</div>')},
'parametres':function(){return shell('parametres','<h1>Paramètres</h1><p class="sub">Profil et abonnement.</p><div class="card" style="max-width:520px"><label style="margin-top:0">Nom complet</label><input placeholder="Votre nom"><label>Adresse e-mail</label><input type="email" placeholder="vous@exemple.com"><label>Plan actuel</label><div class="li" style="padding:12px 0;border:0"><b>FREE</b><span class="tag">Sous-domaine, modèles gratuits</span></div><div class="row" style="margin-top:16px"><button class="btn p">Enregistrer</button><button class="btn">Passer au plan Pro</button></div></div>')},
'publication':function(){return shell('publication','<h1>Publication</h1><p class="sub">Choisissez l\'adresse de votre site.</p><div class="pub">'+(S.pub?'<div class="ok-box"><h3>Site publié</h3><p class="sub" style="margin:8px 0 16px">Votre site est en ligne à l\'adresse ci-dessous.</p><b>'+esc(S.sub)+'.webora.com</b><div class="row" style="margin-top:20px"><a class="btn" href="#/apercu">Voir le site</a><a class="btn p" href="#/dashboard" onclick="S.pub=false">Retour au tableau de bord</a></div></div>':'<label>Adresse du site</label><div class="sd"><input id="sd" value="'+esc(S.sub)+'" placeholder="monbusiness" oninput="S.sub=this.value.toLowerCase().replace(/[^a-z0-9-]/g,\'\')"><span>.webora.com</span></div><p id="er" class="note" style="color:#C0392B;margin:8px 0 0"></p><div class="row" style="margin-top:24px"><a class="btn" href="#/apercu">Retour</a><button class="btn p" onclick="publish()">Publier</button></div>')+'</div>')}
};
function up(k,el){var f=el.files[0];if(!f)return;if(f.size>2000000){el.value='';el.previousElementSibling.textContent='Fichier trop lourd : 2 Mo maximum';return}var r=new FileReader();r.onload=function(){S[k]=r.result;upd()};r.readAsDataURL(f)}
function upd(){var l=$('#live');if(l)l.innerHTML=site()}
function go(r){location.hash='#/'+r}
function auth(su){var e=$('#e').value.trim(),p=$('#p').value;
if(!/^\S+@\S+\.\S+$/.test(e)){$('#er').textContent='Entrez une adresse e-mail valide.';return}
